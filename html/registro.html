    <main>
        <section>
            <h1>Registro de Nuevo Usuario</h1>
            <p>Rellena el siguiente formulario para crear tu cuenta en ConquerBlocks.</p>

            <form action="#" method="POST" enctype="multipart/form-data">
                <fieldset>
                    <legend>Datos Personales</legend>

                    <label for="nombre">Nombre completo:</label><br>
                    <input type="text" id="nombre" name="nombre" required><br><br>

                    <label for="fecha_nac">Fecha de nacimiento:</label><br>
                    <input type="date" id="fecha_nac" name="fecha_nac" required><br><br>

                    <label for="email">Email:</label><br>
                    <input type="email" id="email" name="email" required><br><br>

                    <label for="direccion">Dirección:</label><br>
                    <input type="text" id="direccion" name="direccion" required><br><br>

                    <label for="web">Página web:</label><br>
                    <input type="url" id="web" name="web"><br><br>

                    <label for="foto">Foto de perfil:</label><br>
                    <input type="file" id="foto" name="foto" accept="image/*"><br><br>

                    <label for="bio">Biografía:</label><br>
                    <textarea id="bio" name="bio" rows="5" cols="40"></textarea><br><br>
                </fieldset>

                <br>
                <input type="submit" value="Registrarse">
                <input type="reset" value="Limpiar formulario">
            </form>
        </section>
    </main>
